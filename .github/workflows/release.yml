name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches package version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag must match package.json version');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Only stable versions are published by this workflow');
          JS
      - run: npm ci
      - run: npm run build
      - name: Check generated client
        run: git diff --exit-code -- lib/client.js
      - run: npm run check
      - run: npm test
      - name: Package plugin and checksum
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS
      - name: Prepare release notes
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
          const filename = `${name}-${version}.tgz`;
          const section = readFileSync('CHANGELOG.md', 'utf8').split(`## ${version}\n`)[1]?.split('\n## ')[0]?.trim();
          if (!section) throw new Error('Missing changelog entry');
          const notes = `## 下载与安装 / Download and install\n\n` +
            `- [下载插件 / Download plugin: ${filename}](${base}/releases/download/${tag}/${filename})\n` +
            `- [SHA-256 校验文件 / Checksums](${base}/releases/download/${tag}/SHA256SUMS)\n\n` +
            `在 Harness「插件 → 安装第三方插件」中选择下载的 .tgz 文件，启用并按提示重启。请下载上面的插件包；GitHub 自动生成的 Source code 归档是源码。\n\n` +
            `Install the .tgz using Harness → Plugins → Install third-party plugin. Enable it and restart if prompted. The automatically generated Source code archives are not the plugin package.\n\n` +
            `适配 / Compatibility: Harness 0.2.2-rc.1, Node.js 24.9+.\n\n` +
            `## 本版更新 / Changes\n\n${section}\n\n` +
            `[使用手册 / Usage guide](${base}/blob/${tag}/docs/USAGE.md) · [完整更新日志 / Changelog](${base}/blob/${tag}/CHANGELOG.md)\n`;
          writeFileSync('dist/RELEASE_NOTES.md', notes);
          JS
      - name: Publish GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS \
            --verify-tag --latest --title "Codex Import $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
